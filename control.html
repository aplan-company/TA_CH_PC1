<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SANTA 운영 리모컨</title>
<style>
:root{--bg:#0b1020;--card:#151c33;--line:#26304f;--tx:#eef1fa;--mut:#8a94b3;--gold:#f5c86a;--red:#ff6b6b;--green:#5fd28a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px;padding-bottom:40px}
h1{font-size:19px;margin:4px 0 14px;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}.dot.on{background:var(--green)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;color:var(--mut);font-weight:600;margin:0 0 10px}
.big{font-size:34px;font-weight:700;color:var(--gold)}.big small{font-size:15px;color:var(--mut);font-weight:500;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
button{font:inherit;color:var(--tx);background:#1d2645;border:1px solid var(--line);border-radius:10px;padding:14px 6px;cursor:pointer;touch-action:manipulation}
button.sel{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700}
button:active{transform:scale(.97)}
.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1;min-width:0;font:inherit;background:#0d1328;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px}
.danger{width:100%;margin-top:4px;background:#2a1520;border-color:#5a2533;color:#ffb3b3}.danger.arm{background:var(--red);color:#fff;border-color:var(--red);font-weight:700}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}.stat b{font-weight:600}.stat span{color:var(--mut)}
.msg{min-height:20px;font-size:14px;color:var(--green);margin-top:10px}
.note{font-size:13px;color:var(--mut);margin-top:8px}
</style></head><body>
<h1><span class="dot" id="dot"></span>SANTA 운영 리모컨</h1>
<div class="card" id="pinCard" style="display:none">
  <h2>운영 PIN</h2>
  <div class="row" style="margin-top:0"><input id="pin" type="password" inputmode="numeric" placeholder="PIN 입력"><button id="pinSave" style="padding:12px 18px">저장</button></div>
  <div class="note">이 폰에 저장돼요. 인터넷(LTE·와이파이)만 되면 어디서든 쓸 수 있고, PC1이 2~5초 안에 적용해요.</div>
</div>

<div class="card">
  <h2>소원 문장 유지 시간</h2>
  <div class="big" id="life">–<small>현재</small></div>
  <div class="grid" id="presets"></div>
  <div class="row"><input id="custom" type="number" inputmode="numeric" min="0" max="3600" placeholder="직접 입력 (초)"><button id="apply" style="padding:12px 18px">적용</button></div>
  <div class="msg" id="msg"></div>
  <div class="note">문장이 화면에 나타난 뒤 이 시간이 지나면 2초에 걸쳐 사라져요. 이미 떠 있는 문장에도 바로 적용돼요. PC1을 다시 켜도 기억해요.</div>
</div>

<div class="card">
  <h2>벽 정리</h2>
  <button class="danger" id="clear">벽 문장 모두 지우기</button>
  <div class="note">한 번 누르면 확인 버튼으로 바뀌고, 3초 안에 한 번 더 누르면 실행돼요.</div>
</div>

<div class="card" id="statCard">
  <h2>상태</h2>
  <div class="stat">
    <span>연결</span><b id="sNet">연결 중…</b>
    <span>게임</span><b id="sState">–</b>
    <span>벽 위 문장</span><b id="sCards">–</b>
    <span>오늘 배달</span><b id="sCount">–</b>
    <span>세션 경과</span><b id="sAge">–</b>
    <span>마지막 보고</span><b id="sSeen">–</b>
  </div>
</div>

<script>
/* PC1 릴레이에 붙는 운영 리모컨 — http://<PC1 IP>:8090/control.html
   PC1과 같은 네트워크(와이파이/유선)에 있는 폰·PC에서 열어야 함 */
const QP=new URLSearchParams(location.search);
const ROOM=QP.get('room')||'demo';
const WSURL=QP.get('ws')||('ws://'+location.host);
/* 두 가지 방식
   - PC1 주소로 열면(http://<PC1 IP>:8090/control.html): 릴레이에 바로 연결, 현재 상태가 실시간으로 보임
   - 깃허브 주소로 열면(https://aplan-company.github.io/TA_CH_PC1/control.html): 구글 Apps Script 수신함을 거쳐 전달 (인터넷만 되면 어디서나) */
const WEB=location.protocol==='https:'||QP.get('mode')==='web';
const SHEET_URL=QP.get('sheet')||'https://script.google.com/macros/s/AKfycbzBsj_hIpYQ_hEQMlGfLmm2yFmr9jq57h7jbUsQ0h1zI9BKmEpweX4VTKxM7YJC9yYoiQ/exec';
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(_){return null;}};
const PRESETS=[[10,'10초'],[20,'20초'],[30,'30초'],[60,'1분'],[120,'2분'],[0,'안 사라짐']];
const $=id=>document.getElementById(id);
let ws=null,open=false,st=null,lastT=0;
const fmt=s=>s===0?'안 사라짐':s>=60&&s%60===0?(s/60)+'분':s+'초';
const pg=$('presets');
for(const [v,l] of PRESETS){const b=document.createElement('button');b.textContent=l;b.dataset.v=v;b.onclick=()=>setLife(v);pg.appendChild(b);}
function render(){
  if(WEB){$('dot').classList.add('on');const v=LS('ctl-life');$('life').innerHTML=(v===null?'–':fmt(+v))+'<small>'+(v===null?'':'마지막으로 보낸 값')+'</small>';
    for(const b of pg.children)b.classList.toggle('sel',v!==null&&+b.dataset.v===+v);return;}
  $('dot').classList.toggle('on',open&&Date.now()-lastT<5000);
  $('sNet').textContent=!open?'끊김 · 다시 연결 중':Date.now()-lastT<5000?'정상':'게임 응답 없음';
  if(!st)return;
  $('life').innerHTML=fmt(st.life)+'<small>현재</small>';
  for(const b of pg.children)b.classList.toggle('sel',+b.dataset.v===st.life);
  $('sState').textContent=st.state==='playing'?'배달 중':'대기';
  $('sCards').textContent=(st.cards??'–')+'개';
  $('sCount').textContent=(st.count??'–')+'건';
  $('sAge').textContent=st.age!=null?Math.floor(st.age/60)+'분 '+(st.age%60)+'초':'–';
  $('sSeen').textContent=Math.round((Date.now()-lastT)/1000)+'초 전';}
function connect(){
  ws=new WebSocket(WSURL);
  ws.onopen=()=>{open=true;ws.send(JSON.stringify({type:'hello',role:'control',screen:'remote',room:ROOM}));render();};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.room&&m.room!==ROOM)return;
    if(m.type==='status'&&m.life!==undefined){st=m;lastT=Date.now();render();}};
  ws.onclose=()=>{open=false;render();setTimeout(connect,2000);};
  ws.onerror=()=>{try{ws.close();}catch(_){}};}
function cmd(c){
  if(WEB){const pin=LS('ctl-pin');if(!pin){say('먼저 PIN을 저장해 주세요',true);return false;}
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({inbox:{text:'@ctl '+pin+' '+c,skin:'cmd',wall:0,cid:'ctl'}})})
      .then(()=>say('보냈어요 · PC1이 2~5초 안에 적용해요')).catch(()=>say('보내기 실패 · 인터넷 연결을 확인해 주세요',true));
    const lm=/^life_(\d+)$/.exec(c);if(lm){LS('ctl-life',lm[1]);render();}return false;}
  if(!open){say('PC1에 연결되지 않았어요',true);return false;}ws.send(JSON.stringify({type:'cmd',cmd:c,room:ROOM}));return true;}
function say(t,bad){const m=$('msg');m.textContent=t;m.style.color=bad?'var(--red)':'var(--green)';clearTimeout(say.t);say.t=setTimeout(()=>m.textContent='',4000);}
function setLife(v){v=Math.max(0,Math.min(3600,Math.round(+v)));if(isNaN(v))return;if(cmd('life_'+v))say('적용 요청: '+fmt(v)+' — 1~2초 뒤 위 숫자가 바뀌면 완료');}
$('apply').onclick=()=>{const v=$('custom').value;if(v==='')return;setLife(v);$('custom').value='';};
$('custom').onkeydown=e=>{if(e.key==='Enter')$('apply').click();};
let armT=0;$('clear').onclick=()=>{const b=$('clear');
  if(Date.now()-armT<3000){armT=0;b.classList.remove('arm');b.textContent='벽 문장 모두 지우기';if(cmd('clear_cards'))say('벽 문장을 지우는 중');return;}
  armT=Date.now();b.classList.add('arm');b.textContent='정말 지울까요? 한 번 더 누르기';
  setTimeout(()=>{if(armT&&Date.now()-armT>=3000){armT=0;b.classList.remove('arm');b.textContent='벽 문장 모두 지우기';}},3100);};
if(WEB){$('pinCard').style.display='';$('statCard').style.display='none';$('pin').value=LS('ctl-pin')||'';
  $('pinSave').onclick=()=>{LS('ctl-pin',$('pin').value.trim());say('PIN 저장됨');};render();}
else{setInterval(render,1000);connect();}
</script></body></html>
