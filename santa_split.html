<script>
/* ============================================================
   공용 통신 레이어 (game.html / phone.html / test.html 공유)
   - ?ws=ws://192.168.0.100:8090  → 로컬 WebSocket 릴레이(PC 여러 대)
   - 파라미터 없으면 BroadcastChannel  → PC 한 대에서 창/탭/iframe 테스트
   메시지는 모두 JSON. 릴레이는 받은 메시지를 다른 모든 클라이언트에 그대로 뿌림.
   ============================================================ */
(function(){
const QP=new URLSearchParams(location.search);
const ROOM=QP.get('room')||'demo';
function makeNet(role,screen){
  const handlers=[];let ws=null,bc=null,mode,open=false;const queue=[];
  const emit=m=>{for(const h of handlers)try{h(m);}catch(e){console.error(e);}};
  const url=QP.get('ws');
  if(url){mode='ws';
    const connect=()=>{ws=new WebSocket(url);
      ws.onopen=()=>{open=true;ws.send(JSON.stringify({type:'hello',role,screen,room:ROOM}));while(queue.length)ws.send(queue.shift());emit({type:'_net',up:true});};
      ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(m.room&&m.room!==ROOM)return;emit(m);};
      ws.onclose=()=>{open=false;emit({type:'_net',up:false});setTimeout(connect,1500);};
      ws.onerror=()=>{try{ws.close();}catch(_){}};};
    connect();
  }else{mode='bc';bc=new BroadcastChannel('madsync-'+ROOM);bc.onmessage=e=>emit(e.data);open=true;setTimeout(()=>emit({type:'_net',up:true}),0);}
  return {mode,room:ROOM,
    send(m){m.room=ROOM;if(mode==='bc'){bc.postMessage(m);return;}const s=JSON.stringify(m);if(open&&ws.readyState===1)ws.send(s);else if(queue.length<50)queue.push(s);},
    on(h){handlers.push(h);},
    get up(){return open;}};
}
/* 백그라운드에서도 멈추지 않는 타이머 (Worker 기반 — 숨은 탭에서 setInterval 1Hz 제한 회피) */
function steadyTimer(hz,cb){
  try{const src=`let id=setInterval(()=>postMessage(0),${Math.round(1000/hz)});`;
    const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));w.onmessage=cb;return ()=>w.terminate();}
  catch(e){const id=setInterval(cb,1000/hz);return ()=>clearInterval(id);}
}
window.MadNet={makeNet,steadyTimer,QP,ROOM};
})();

/* ============================================================
   SANTA 분할 화면 설정 (MadSync 구조)
   santa_split.html?screen=1|2|3|4 한 화면 구간만 그림 (네 벽을 이으면 20652×1200 한 세계)
                   &host=1         이 화면이 호스트: 폰 입력(PeerJS)·이벤트 순서·상태 보고 담당
                   &ws=ws://IP:8090  PC 여러 대일 때 로컬 WebSocket 릴레이 (없으면 같은 PC 탭끼리 BroadcastChannel)
                   &room=이름        방 이름 (PeerJS ID + 화면끼리 채널) · 기본 aplan-santa-delivery
   파라미터 없음 = screen=all + 호스트 (기존 index_wide 와 동일하게 단독 실행)
   동기화 방식: 결정론적 락스텝 — 모든 화면이 같은 시드·같은 고정 스텝(1/60초)으로 같은 시뮬레이션을 돌리고,
   호스트는 입력(소원·키)만 "몇 번째 스텝에 적용" 표시해서 보냄. 그래서 상태 스냅샷 없이도 화면이 이음새 없이 맞음.
   ============================================================ */
const SQ=new URLSearchParams(location.search);
const SCREEN=SQ.get('screen')||'all';
const SPLIT=SCREEN!=='all';
/* 벽 구성: ?walls=3952,6200,4400,6100 (기본 = PC1~4 네 벽) · ?main=2 트리가 서는 메인 벽 */
const WALL_W=(SQ.get('walls')||'3952,6200,4400,6100').split(',').map(Number).filter(v=>v>0);
const SEGS=[];{let a=0;for(const w of WALL_W){SEGS.push([a,a+w]);a+=w;}}
const WORLD_W=SEGS[SEGS.length-1][1];
const MAIN_WALL=Math.min(SEGS.length,Math.max(1,+(SQ.get('main')||2)));
const CX=Math.round((SEGS[MAIN_WALL-1][0]+SEGS[MAIN_WALL-1][1])/2); // 큰 트리 위치 = 메인 벽 가운데
const [X0,X1]=SPLIT?SEGS[Math.min(SEGS.length,Math.max(1,+SCREEN||1))-1]:[0,WORLD_W];
const SW=X1-X0;
/* 내 벽만 그리기: 구간(±여유) 밖 오브젝트는 그리기 생략 (?cull=0 이면 끔). 계산·난수는 모든 화면이 그대로 함 */
const CULL=SQ.get('cull')!=='0';
const VX0=CULL?X0-80:-1e9,VX1=CULL?X1+80:1e9;
const IS_HOST=SQ.has('host')?SQ.get('host')==='1':!SPLIT;
/* 시드 난수 (mulberry32) — 게임 코드의 Math.random() 을 전부 SRND() 로 교체 */
let RSTATE=0x5A17A;
function SRND(){let t=RSTATE=(RSTATE+0x6D2B79F5)|0;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}
function SRESEED(s){RSTATE=s|0;}
/* 시뮬레이션 시간 (ms) — performance.now() 대신 */
const STEP=1/60,STEP_MS=1000/60;
let SIMNOW=0,simStep=0;
document.documentElement.dataset.screen=SCREEN;

</script>
<div id="stage">
  <canvas id="bg" width="14550" height="1200"></canvas>
  <canvas id="scene" width="14550" height="1200"></canvas>
  <div id="count"><small>배달된 소원</small><span id="n">0</span></div>
  <div id="qrs"></div>
</div>

<script>
const W=WORLD_W,H=1200,TAU=Math.PI*2;
document.getElementById('stage').style.width=W+'px';document.getElementById('bg').width=W;
const ENTER=1100,FADE=320; // 액터 등장/퇴장 거리(화면이 넓어 가장자리 대신 목표 근처에서 페이드)
const stage=document.getElementById('stage');
/* 세로 맞춤 + 가로 팬: 실제 LED(14550 폭)에서는 1:1, 작은 창에서는 드래그/휠/←→로 가로 이동. ?fit=all 이면 전체 보기 */
const FIT_ALL=new URLSearchParams(location.search).get('fit')==='all';
let panX=0,scaleV=1;
function fit(){if(SPLIT){const sc=Math.min(innerWidth/SW,innerHeight/H);stage.style.transform=`translate(${(innerWidth-SW*sc)/2}px,${(innerHeight-H*sc)/2}px) scale(${sc}) translateX(${-X0}px)`;return;}scaleV=FIT_ALL?Math.min(innerWidth/W,innerHeight/H):innerHeight/H;const minX=Math.min(0,innerWidth-W*scaleV);panX=Math.max(minX,Math.min(0,panX));
  stage.style.transform=`translate(${panX}px,${FIT_ALL?(innerHeight-H*scaleV)/2:0}px) scale(${scaleV})`;}
addEventListener('resize',fit);fit();
/* QR 패널: 벽1(0~3952) 양끝 2 · 벽2(3952~10152) 좌·중·우 3 · 벽3(10152~14550) 양끝 2 */
const WALLS=SEGS,QR_PW=220,QR_IN=90;
// 벽마다 균등 배치: 2개 벽은 1/4·3/4, 3개 벽은 1/6·1/2·5/6 지점 (QR 중심)
const QR_F=WALLS.map(([a,b],i)=>i===MAIN_WALL-1?[.25,.75]:b-a>5000?[1/6,.5,5/6]:[.25,.75]); // 메인 벽(트리)은 트리 양옆 2개, 넓은 벽 3개, 나머지 2개
const QR_X=[];WALLS.forEach(([a,b],i)=>QR_F[i].forEach(f=>QR_X.push(Math.round(a+(b-a)*f-QR_PW/2))));
const QRZ=QR_X.map(x=>[x-40,x+QR_PW+40]);
(function(){const box=document.getElementById('qrs');QR_X.forEach((x,i)=>{const d=document.createElement('div');d.className='ui';d.style.left=x+'px';d.style.width=QR_PW+'px';d.style.boxSizing='border-box';
  d.style.background='none';d.style.border='0';d.style.boxShadow='none';d.style.padding='0';
  d.innerHTML='<div class="qr" style="box-shadow:0 0 30px rgba(255,240,200,.35)"></div>'+(i===0?'<div class="t3" id="status" style="display:none">연결 준비 중…</div>':'');box.appendChild(d);});})();
let dragX=null,dragP=0;if(!SPLIT)document.body.style.cursor='grab';
addEventListener('mousedown',e=>{dragX=e.clientX;dragP=panX;document.body.style.cursor='grabbing';});
addEventListener('mousemove',e=>{if(dragX===null)return;panX=dragP+(e.clientX-dragX);fit();});
addEventListener('mouseup',()=>{dragX=null;document.body.style.cursor='grab';});
addEventListener('wheel',e=>{panX-=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY);fit();},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){panX+=400;fit();}if(e.key==='ArrowRight'){panX-=400;fit();}if(e.key==='Home'){panX=0;fit();}if(e.key==='End'){panX=-1e9;fit();}});
let bg=document.getElementById('bg').getContext('2d');const BGR=bg;
{const sc=document.getElementById('scene');sc.width=SW;sc.style.left=X0+'px';}
let ctx=document.getElementById('scene').getContext('2d');
const rnd=(a,b)=>a+SRND()*(b-a);
const pickOne=a=>a[Math.floor(SRND()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
/* 종이 레이어: draw(path만) → 그림자 + 채움 + 밝은 가장자리 */
function paperOn(c,draw,fill,shadow=10,edge='rgba(255,255,255,.14)'){c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=shadow;c.shadowOffsetY=shadow*.5;c.fillStyle=fill;draw(c);c.fill();c.restore();if(edge){c.save();c.strokeStyle=edge;c.lineWidth=1.5;draw(c);c.stroke();c.restore();}}
const paper=(draw,fill,shadow,edge)=>paperOn(ctx,draw,fill,shadow,edge);
function rrOn(c,X,Y,w,h,r){c.beginPath();c.moveTo(X+r,Y);c.arcTo(X+w,Y,X+w,Y+h,r);c.arcTo(X+w,Y+h,X,Y+h,r);c.arcTo(X,Y+h,X,Y,r);c.arcTo(X,Y,X+w,Y,r);c.closePath();}
/* 물결(스캘럽) 털/눈 테두리 */
function furOn(c,X,Y,w,h,n,col='#f4f1ea'){paperOn(c,cc=>{cc.beginPath();cc.moveTo(X,Y);cc.lineTo(X+w,Y);cc.lineTo(X+w,Y+h*.65);for(let i=n;i>=0;i--){cc.arc(X+w*i/n,Y+h*.65,w/n*.55,0,Math.PI,false);}cc.closePath();},col,6,'rgba(255,255,255,.5)');}

/* ================= 배경 ================= */
const pickOn=a=>a[Math.floor(SRND()*a.length)];
const GROUND=860;let windows=[],houses=[],treeOrn=[];let MOON={x:-9999,y:-9999,r:0},TREE={x:CX,y:GROUND+30,h:640,w:380},LAKE={x:CX+2600,y:GROUND+130,rx:520,ry:80};
/* ================= 공통: 종이 질감(패턴) + 작은 인물 ================= */
const grainTile=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const id=g.createImageData(256,256);for(let i=0;i<id.data.length;i+=4){const v=128+(SRND()-.5)*40;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);return c;})();
function grain(c){c.save();c.globalCompositeOperation='overlay';c.globalAlpha=.35;c.fillStyle=c.createPattern(grainTile,'repeat');c.fillRect(0,0,W,H);c.restore();}
function vignette(c){const vg=c.createLinearGradient(0,0,0,H);vg.addColorStop(0,'rgba(0,0,0,.28)');vg.addColorStop(.3,'rgba(0,0,0,0)');vg.addColorStop(.85,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.3)');c.fillStyle=vg;c.fillRect(0,0,W,H);}

/* ===== 상세 종이공예: 공장 / 엘프 / 순록 (스타일 목업에서 이식) ===== */
function gearStatic(x,y,r,n,col,a=0){ctx.save();ctx.translate(x,y);ctx.rotate(a);paper(c=>{c.beginPath();for(let i=0;i<n;i++){const t=i/n*TAU,t2=(i+.5)/n*TAU;c.lineTo(Math.cos(t)*r,Math.sin(t)*r);c.lineTo(Math.cos(t+.18)*r*1.18,Math.sin(t+.18)*r*1.18);c.lineTo(Math.cos(t2)*r*1.18,Math.sin(t2)*r*1.18);c.lineTo(Math.cos(t2+.12)*r,Math.sin(t2+.12)*r);}c.closePath();},col,8,'rgba(255,255,255,.3)');
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(0,0,r*.55,0,TAU);ctx.fill();paper(c=>{c.beginPath();c.arc(0,0,r*.28,0,TAU);},col,3,'rgba(255,255,255,.4)');ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=r*.12;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(i*Math.PI/2+a)*r*.55,Math.sin(i*Math.PI/2+a)*r*.55);ctx.stroke();}ctx.restore();}
function bulbLine(x0,y0,x1,y1,n){ctx.strokeStyle='#2f8f5b';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<=n*4;i++){const u=i/(n*4);ctx.lineTo(x0+(x1-x0)*u,y0+(y1-y0)*u+Math.sin(u*Math.PI)*30);}ctx.stroke();
  for(let i=1;i<n;i++){const u=i/n,px=x0+(x1-x0)*u,py=y0+(y1-y0)*u+Math.sin(u*Math.PI)*30+8;ctx.fillStyle=['#ff4d5a','#f5c86a','#7fd8ff','#9dff8a'][i%4];ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(px,py,5,0,TAU);ctx.fill();}ctx.shadowBlur=0;}
function win(x,y,w,h,arch){ // 아치창: 어두운 테 → 따뜻한 빛 → 창살 → 눈 턱
  paper(c=>{c.beginPath();if(arch){c.moveTo(x,y+h);c.lineTo(x,y+w/2);c.arc(x+w/2,y+w/2,w/2,Math.PI,0);c.lineTo(x+w,y+h);}else c.rect(x,y,w,h);c.closePath();},'#2a1a10',6,'rgba(255,255,255,.15)');
  ctx.save();ctx.shadowBlur=22;ctx.shadowColor='rgba(255,210,120,.9)';ctx.fillStyle='#ffd27a';ctx.beginPath();if(arch){ctx.moveTo(x+6,y+h-6);ctx.lineTo(x+6,y+w/2);ctx.arc(x+w/2,y+w/2,w/2-6,Math.PI,0);ctx.lineTo(x+w-6,y+h-6);}else ctx.rect(x+6,y+6,w-12,h-12);ctx.closePath();ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x+6,y+h*.35,w-12,8);
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x+w/2,y+(arch?2:6));ctx.lineTo(x+w/2,y+h-6);ctx.moveTo(x+6,y+h*.55);ctx.lineTo(x+w-6,y+h*.55);ctx.stroke();
  furOn(ctx,x-8,y+h-2,w+16,12,Math.max(3,Math.floor(w/18)));}
function bricks(x,y,w,h,col){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.strokeStyle=col;ctx.lineWidth=1.2;for(let yy=y;yy<y+h;yy+=16){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+w,yy);ctx.stroke();const off=((yy-y)/16%2)*22;for(let xx=x+off;xx<x+w;xx+=44){ctx.beginPath();ctx.moveTo(xx,yy);ctx.lineTo(xx,yy+16);ctx.stroke();}}ctx.restore();}
function sign(x,y,text,w=300){ctx.strokeStyle='#8a5a2b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-w/2+30,y-40);ctx.lineTo(x-w/2+30,y);ctx.moveTo(x+w/2-30,y-40);ctx.lineTo(x+w/2-30,y);ctx.stroke();
  paper(c=>{rrOn(c,x-w/2,y,w,64,10);},'#5a3a1a',10,'rgba(255,255,255,.2)');paper(c=>{rrOn(c,x-w/2+8,y+8,w-16,48,6);},'#f3e9d6',4,'rgba(255,255,255,.6)');
  ctx.fillStyle='#d8343f';ctx.font="bold 30px 'Gowun Batang',Georgia,serif";ctx.textAlign='center';ctx.fillText(text,x,y+42);ctx.fillStyle='#f5c86a';for(const sx of[-1,1]){ctx.beginPath();ctx.arc(x+sx*(w/2-22),y+32,5,0,TAU);ctx.fill();}
  furOn(ctx,x-w/2-6,y-6,w+12,14,Math.floor(w/22));}
function chimney(x,top,h,w,stripe=true){paper(c=>{c.beginPath();c.rect(x-w/2,top,w,h);},'#1b1b2e',10,'rgba(255,255,255,.14)');bricks(x-w/2,top,w,h,'rgba(255,255,255,.1)');
  if(stripe){ctx.save();ctx.beginPath();ctx.rect(x-w/2,top,w,h);ctx.clip();ctx.strokeStyle='#d8343f';ctx.lineWidth=w*.28;for(let k=-1;k<h/50+1;k++){ctx.beginPath();ctx.moveTo(x-w/2-10,top+k*50);ctx.lineTo(x+w/2+10,top+k*50+w*.7);ctx.stroke();}ctx.restore();}
  paper(c=>{rrOn(c,x-w/2-8,top-6,w+16,16,5);},'#2b2320',6,'rgba(255,255,255,.2)');furOn(ctx,x-w/2-12,top-12,w+24,16,4);
  houses.push({cx:x,ctop:top-14,wins:[],roofY:top});}
function gifts(x,base){const cols=[['#d8343f','#f5c86a'],['#2f8f5b','#fff'],['#3b6fd6','#fff'],['#f5c86a','#d8343f']];let i=0;for(const [dx,dy,s] of [[0,0,44],[50,0,38],[22,-40,36],[96,0,34]]){const col=cols[i++%4];paper(c=>{rrOn(c,x+dx-s/2,base+dy-s,s,s,6);},col[0],6,'rgba(255,255,255,.2)');ctx.fillStyle=col[1];ctx.fillRect(x+dx-s/2,base+dy-s/2-3,s,6);ctx.fillRect(x+dx-3,base+dy-s,6,s);ctx.strokeStyle=col[1];ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+dx-7,base+dy-s-5,6,0,TAU);ctx.arc(x+dx+7,base+dy-s-5,6,0,TAU);ctx.stroke();}}

/* ===== A. 마을 공방형 (추천) ===== */
function factoryA(x,base){ // x: 중심

  ctx.strokeStyle='#2f8f5b';ctx.lineWidth=7;ctx.beginPath();ctx.arc(mx+mw/2,base-62,18,0,TAU);ctx.stroke();ctx.fillStyle='#d8343f';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(mx+mw/2+Math.cos(i*1.25)*18,base-62+Math.sin(i*1.25)*18,3.5,0,TAU);ctx.fill();}ctx.fillStyle='#d8343f';ctx.beginPath();ctx.arc(mx+mw/2,base-44,5,0,TAU);ctx.fill();

  furOn(ctx,bx-30,base-h-6,w+60,16,20);

  paper(c=>{c.beginPath();c.arc(bx+w/2,base-h-50,58,0,TAU);},'#2a1a10',8);ctx.save();ctx.shadowBlur=24;ctx.shadowColor='#ffd27a';ctx.fillStyle='#fff3d6';ctx.beginPath();ctx.arc(bx+w/2,base-h-50,48,0,TAU);ctx.fill();ctx.restore();ctx.strokeStyle='#1b1b2e';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(bx+w/2,base-h-50);ctx.lineTo(bx+w/2,base-h-86);ctx.moveTo(bx+w/2,base-h-50);ctx.lineTo(bx+w/2+24,base-h-30);ctx.stroke();

  paper(c=>{rrOn(c,bx+w/2-70,base-110,140,110,10);},'#1b1b2e',8);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=2;for(let k=1;k<6;k++){ctx.beginPath();ctx.moveTo(bx+w/2-70,base-110+k*18);ctx.lineTo(bx+w/2+70,base-110+k*18);ctx.stroke();}

  // 굴뚝 3 (높이 다르게) + 파이프

  ctx.strokeStyle='#6b5a4a';ctx.lineWidth=14;ctx.beginPath();ctx.moveTo(bx+w+10,base-h+40);ctx.lineTo(bx+w+60,base-h+40);ctx.lineTo(bx+w+60,base-40);ctx.stroke();paper(c=>{c.beginPath();c.arc(bx+w+60,base-h+100,16,0,TAU);},'#b8892e',6,'rgba(255,255,255,.3)');

function stripes(draw,base,stripe,step=14){ctx.save();ctx.beginPath();draw(ctx);ctx.clip();ctx.fillStyle=base;ctx.fillRect(-400,-400,800,800);ctx.strokeStyle=stripe;ctx.lineWidth=step*.5;for(let y=-400;y<400;y+=step){ctx.beginPath();ctx.moveTo(-400,y);ctx.lineTo(400,y);ctx.stroke();}ctx.restore();}
function drawBoxE(x,y,s,col){paper(c=>{rrOn(c,x-s/2,y-s,s,s,5);},col[0],6,'rgba(255,255,255,.2)');ctx.fillStyle=col[1];ctx.fillRect(x-s/2,y-s/2-3,s,6);ctx.fillRect(x-3,y-s,6,s);ctx.strokeStyle=col[1];ctx.lineWidth=3;ctx.beginPath();ctx.arc(x-7,y-s-5,6,0,TAU);ctx.arc(x+7,y-s-5,6,0,TAU);ctx.stroke();}

/* ===== 엘프: 종이공예 디테일 (납작·통통 비율) =====

function drawElf(x,y,dir,o={}){const s=o.k||1;ctx.save();ctx.translate(x,y);ctx.scale(dir*s,s);
  const tunic=o.tunic||'#2f8f5b',hat=o.hat||'#d8343f',st=o.stripe||'#d8343f',pose=o.pose||'stand',w=o.walk||0,g=o.gender||'m',skin=o.skin||'#f8d2b8',hairCol=o.hairCol||'#5a3a1a';

  for(const [lx,dd] of [[-13,-sw],[13,sw]]){
    stripes(c=>{c.beginPath();c.moveTo(lx-10,-34);c.lineTo(lx+10,-34);c.lineTo(lx+10+dd*.6,-4);c.lineTo(lx-10+dd*.6,-4);c.closePath();},'#f4f1ea',st,11);
    const fx=lx+dd*.6;paper(c=>{c.beginPath();c.moveTo(fx-12,-6);c.lineTo(fx+10,-6);c.quadraticCurveTo(fx+34,-6,fx+30,-24);c.quadraticCurveTo(fx+24,-8,fx+12,2);c.lineTo(fx-12,2);c.closePath();},tunic,5,'rgba(255,255,255,.25)');
    ctx.fillStyle='#f5c86a';ctx.beginPath();ctx.arc(fx+30,-25,4.5,0,TAU);ctx.fill();}

  paper(c=>{c.beginPath();c.moveTo(-34,HB);c.lineTo(34,HB);c.quadraticCurveTo(44,-60,flare,-32);for(let i=6;i>=0;i--)c.arc(-flare+flare*2*i/7+flare/7,-32,flare/7,0,Math.PI,false);c.closePath();},tunic,10,'rgba(255,255,255,.2)');
  ctx.fillStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.moveTo(-34,HB);ctx.lineTo(0,HB);ctx.lineTo(0,-32);ctx.lineTo(-flare,-32);ctx.closePath();ctx.fill();
  if(g==='f'){stripes(c=>{c.beginPath();c.moveTo(-flare+4,-40);c.lineTo(flare-4,-40);c.lineTo(flare-2,-32);c.lineTo(-flare+2,-32);c.closePath();},'#f4f1ea',st,8);}
  if(o.apron){paper(c=>{c.beginPath();c.moveTo(-22,-80);c.lineTo(22,-80);c.lineTo(28,-38);c.lineTo(-28,-38);c.closePath();},'#d9b382',5,'rgba(255,255,255,.3)');ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(-14,-66,28,14);}
  paper(c=>{rrOn(c,-42,-70,84,12,4);},'#1b1b2e',4,'rgba(255,255,255,.2)');paper(c=>{rrOn(c,-9,-73,18,18,3);},'#f5c86a',3,'rgba(255,255,255,.5)');ctx.fillStyle='#1b1b2e';ctx.fillRect(-3,-69,6,10);
  ctx.fillStyle='#f5c86a';for(const by of[-88,-80]){ctx.beginPath();ctx.arc(0,by,3.2,0,TAU);ctx.fill();}
  furOn(ctx,-38,-104,76,14,7);
  // --- 팔 + 줄무늬 커프 + 장갑
  ctx.strokeStyle=tunic;ctx.lineWidth=13;ctx.lineCap='round';
  const A={stand:[[-30,-90,-40,-52],[30,-90,40,-52]],walk:[[-30,-90,-40+sw*.5,-52],[30,-90,40-sw*.5,-52]],carry:[[-30,-90,6,-74],[30,-90,36,-66]],hammer:[[-30,-90,-42,-60],[30,-90,40,-124]],wave:[[-30,-90,-40,-52],[30,-90,50,-128]],push:[[-30,-90,-6,-70],[30,-90,44,-68]]}[pose];
  for(const [ax,ay,bx,by] of A){ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();stripes(c=>{c.beginPath();c.arc(bx,by,9.5,0,TAU);},'#f4f1ea',st,6);paper(c=>{c.beginPath();c.arc(bx+(bx>0?5:-5),by+2,8.5,0,TAU);},'#d9b382',3,'rgba(255,255,255,.3)');}
  if(pose==='carry')drawBoxE(26,-56,40,o.box||['#d8343f','#f5c86a']);
  if(pose==='hammer'){ctx.save();ctx.translate(40,-124);ctx.rotate(o.swing||1.4);ctx.strokeStyle='#8a5a2b';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-48);ctx.stroke();paper(c=>{rrOn(c,-16,-62,32,18,4);},'#6b5a4a',5,'rgba(255,255,255,.3)');ctx.restore();}
  // --- 머리 (크게, 납작)
  const HY=-134,R=30;
  // 뒷머리/땋은 머리 (여)
  if(g==='f'){const hs=o.hair||'braids';
    if(hs==='braids'){for(const ex of[-1,1]){ctx.strokeStyle=hairCol;ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(ex*26,HY+6);ctx.quadraticCurveTo(ex*40,HY+30,ex*36,HY+56);ctx.stroke();ctx.fillStyle=hairCol;for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(ex*(30+k*3),HY+16+k*14,7,0,TAU);ctx.fill();}paper(c=>{c.beginPath();c.moveTo(ex*36,HY+56);c.lineTo(ex*44,HY+48);c.lineTo(ex*46,HY+62);c.lineTo(ex*28,HY+62);c.lineTo(ex*28,HY+48);c.closePath();},st,3,'rgba(255,255,255,.4)');}}

const MAPS={};let MAP=null,mapKey='',npcs=[],mapT=0,trans=null;

function setMap(key,instant){if(!MAPS[key]||key===mapKey)return;
  const mc=mapCanvas.getContext('2d');
  if(mapKey&&!instant){prevCanvas.getContext('2d').drawImage(document.getElementById('bg'),0,0);trans={t:0};}
  windows=[];houses=[];treeOrn=[];MOON={x:-9999,y:-9999,r:0};
  mc.clearRect(0,0,W,H);MAPS[key].build(mc);

  MAP=MAPS[key];mapKey=key;mapT=0;npcs=MAP.npcs();}

function drawTransition(dt){if(!trans)return;trans.t+=dt;const k=ease(clamp(trans.t/2.2,0,1));const x=k*(W+400);

const dropOpts=m=>({vz:m==='star'?-rnd(380,520):m==='balloon'?120:m==='snowpile'?500:0,tilt:m==='snowpile'?rnd(-.35,.35):0});
function sleighBase(dir,y,ax){return {dir,x:ax-dir*ENTER,y,t:0,bags:0,ax};}
const outOfScreen=s=>Math.abs(s.x-(s.bx??s.ax))>ENTER+FADE;
const reached=(s,x)=>(s.dir>0&&s.x>=x)||(s.dir<0&&s.x<=x);

/* ================= 액터 ================= */
const ACTORS={};
/* 1. 썰매 투하 (기본) */
ACTORS.santa={w:3,take:4,make(load){const dir=SRND()<.5?1:-1;const c=spot(LAND);
  const drops=load.map((w,i)=>{const m=pickOne(['drop','drop','parachute','snowpile']);return {w,m,x:clamp(c.x+(i-(load.length-1)/2)*rnd(300,420)+rnd(-60,60),400,W-400),y:rnd(LAND[0],LAND[1]),done:false};}).sort((a,b)=>dir>0?a.x-b.x:b.x-a.x);
  const s=sleighBase(dir,rnd(200,420),drops[0].x);s.bx=drops[drops.length-1].x;s.kind='santa';s.bags=load.length;s.drops=drops;
  s.update=function(dt,t){this.x+=this.dir*260*dt;for(const d of this.drops)if(!d.done&&reached(this,d.x)){d.done=true;this.bags--;spawnBox(d.w,d.m,d.x,d.y,this.y,dropOpts(d.m));burst(this.x,this.y,'#f5c86a',12);}
    trail(this);drawSleigh(this,t);return outOfScreen(this);};return s;}};
function trail(s){if(SRND()<.6)parts.push({x:s.x-s.dir*rnd(60,110),y:s.y+rnd(-10,20),vx:-s.dir*30,vy:rnd(-10,10),r:rnd(1,2.5),c:'#f5c86a',life:rnd(.4,.9)});}

/* 2. 지나쳤다 후진 */
ACTORS.back={w:2,take:1,make([w]){const dir=SRND()<.5?1:-1;const p=spot(LAND);const s=sleighBase(dir,rnd(200,420),p.x);s.kind='back';s.bags=1;s.tx=p.x;s.ty=p.y;s.phase='fly';
  s.update=function(dt,t){this.t+=dt;const sp=260;
    if(this.phase==='fly'){this.x+=this.dir*sp*dt;if(reached(this,this.tx+this.dir*260)){this.phase='stop';this.t=0;}}
    else if(this.phase==='stop'){if(this.t>.7){this.phase='back';this.t=0;}}
    else if(this.phase==='back'){this.x-=this.dir*sp*.8*dt;if(!reached(this,this.tx)){this.phase='drop';this.t=0;this.bags=0;spawnBox(w,'drop',this.tx,this.ty,this.y,{});burst(this.x,this.y,'#f5c86a',12);}}
    else{this.x+=this.dir*sp*dt;}
    trail(this);drawSleigh(this,t,{back:this.phase==='back',still:this.phase==='stop',arms:this.phase==='stop'?'back':'ride'});
    if(this.phase==='stop'){ctx.fillStyle='#fff8e8';ctx.font='bold 40px serif';ctx.textAlign='center';ctx.fillText('?',this.x+this.dir*30,this.y-150);}
    return this.phase!=='back'&&this.phase!=='stop'&&outOfScreen(this);};return s;}};

/* 3. 하늘로 던지기 → 별에 걸리거나 풍선 */
ACTORS.throw={w:2,take:1,make([w]){const dir=SRND()<.5?1:-1;const p=spot(SKY);const s=sleighBase(dir,rnd(380,480),p.x);s.kind='throw';s.bags=1;s.tx=p.x-dir*120;s.ty=p.y;s.mode=SRND()<.5?'star':'balloon';s.phase='fly';
  s.update=function(dt,t){this.t+=dt;
    if(this.phase==='fly'){this.x+=this.dir*260*dt;if(reached(this,this.tx)){this.phase='aim';this.t=0;}}
    else if(this.phase==='aim'){if(this.t>.6){this.phase='throw';this.t=0;this.bags=0;spawnBox(w,this.mode,this.tx+this.dir*120,this.ty,this.y-60,this.mode==='star'?{vz:-rnd(420,520)}:{vz:60});burst(this.x+this.dir*40,this.y-90,'#f5c86a',16,120);}}
    else if(this.phase==='throw'){if(this.t>1.4){this.phase='leave';}}
    else{this.x+=this.dir*260*dt;}
    trail(this);drawSleigh(this,t,{still:this.phase==='aim'||this.phase==='throw',arms:this.phase==='aim'?'back':this.phase==='throw'?'throw':'ride'});return this.phase==='leave'&&outOfScreen(this);};return s;}};

/* 4. 자루 쏟기 (여러 개) */
ACTORS.spill={w:2,take:4,make(load){const dir=SRND()<.5?1:-1;const c=spot(LAND);const s=sleighBase(dir,rnd(200,400),c.x);s.kind='spill';s.bags=load.length;s.tx=c.x;s.phase='fly';
  s.items=load.map((w,i)=>({w,x:clamp(c.x+(i-(load.length-1)/2)*190+rnd(-30,30),400,W-400),y:rnd(LAND[0],LAND[1])}));
  s.update=function(dt,t){this.t+=dt;
    if(this.phase==='fly'){this.x+=this.dir*260*dt;if(reached(this,this.tx-this.dir*60)){this.phase='shake';this.t=0;}}
    else if(this.phase==='shake'){this.x+=this.dir*120*dt;this.y+=Math.sin(this.t*30)*6;if(this.t>.9){this.phase='spill';this.t=0;for(const it of this.items)spawnBox(it.w,'drop',it.x,it.y,this.y,{});this.bags=0;burst(this.x-this.dir*50,this.y-40,'#f5c86a',40,120);laserSend('/santa/cue/spill',1,+(this.x/W).toFixed(3));}}
    else if(this.phase==='spill'){this.x+=this.dir*120*dt;if(this.t>1.2){this.phase='leave';}}
    else{this.x+=this.dir*260*dt;}
    trail(this);drawSleigh(this,t,{tilt:this.phase==='shake'?Math.sin(this.t*30)*.12:this.phase==='spill'?-this.dir*.3*Math.max(0,1-this.t):0,bagTilt:this.phase==='spill'?1.3:this.phase==='shake'?Math.sin(this.t*30)*.3:0,arms:this.phase==='spill'?'cheer':'ride'});
    if(this.phase==='spill'&&this.t<.8){ctx.fillStyle='#fff8e8';ctx.font='bold 40px serif';ctx.textAlign='center';ctx.fillText('!',this.x+this.dir*30,this.y-150);}
    return this.phase==='leave'&&outOfScreen(this);};return s;}};

/* 5. 졸다가 루돌프가 깨움 */
ACTORS.sleep={w:2,take:1,make([w]){const dir=SRND()<.5?1:-1;const p=spot(LAND);const s=sleighBase(dir,rnd(220,420),p.x);s.kind='sleep';s.bags=1;s.tx=p.x;s.ty=p.y;s.phase='fly';
  s.update=function(dt,t){this.t+=dt;
    if(this.phase==='fly'){this.x+=this.dir*260*dt;if(reached(this,this.tx)){this.phase='doze';this.t=0;}}
    else if(this.phase==='doze'){this.y+=Math.sin(t*1.5)*.3;if(this.t>2.2){this.phase='kick';this.t=0;}}
    else if(this.phase==='kick'){if(this.t>.5&&!this.dropped){this.dropped=true;this.bags=0;spawnBox(w,'drop',this.tx,this.ty,this.y,{});burst(this.x,this.y,'#f5c86a',16);}if(this.t>1.3){this.phase='wake';this.t=0;}}
    else if(this.phase==='wake'){if(this.t>1){this.phase='leave';}}
    else{this.x+=this.dir*300*dt;}
    const still=this.phase==='doze'||this.phase==='kick'||this.phase==='wake';
    if(!still)trail(this);
    const jolt=this.phase==='kick'?Math.sin(this.t*40)*6*Math.max(0,1-this.t):0;ctx.save();ctx.translate(0,jolt);
    drawSleigh(this,t,{still,santa:this.phase==='doze'||this.phase==='kick'?'sleep':'ride',arms:this.phase==='wake'?'cheer':'ride',kick:this.phase==='kick',lookBack:this.phase==='kick'||this.phase==='doze'&&this.t>1.4});ctx.restore();
    if(this.phase==='doze'){ctx.fillStyle='#fff8e8';ctx.font="30px 'Nanum Pen Script',cursive";ctx.textAlign='center';for(let i=0;i<3;i++){const k=(this.t*.8+i*.33)%1;ctx.globalAlpha=1-k;ctx.fillText('z',this.x+this.dir*(10+k*40),this.y-110-k*70);}ctx.globalAlpha=1;}
    if(this.phase==='wake'&&this.t<.7){ctx.fillStyle='#fff8e8';ctx.font='bold 40px serif';ctx.textAlign='center';ctx.fillText('!',this.x+this.dir*30,this.y-150);}
    return this.phase==='leave'&&outOfScreen(this);};return s;}};

/* 6. 굴뚝 다이빙 */
ACTORS.dive={w:2,take:1,make([w]){const h=pickOne(houses);const dir=SRND()<.5?1:-1;const s=sleighBase(dir,h.ctop-150,h.cx);s.kind='dive';s.bags=1;s.house=h;s.tx=h.cx+dir*90;s.phase='fly';s.man={x:h.cx,y:h.ctop-150,k:1};
  s.update=function(dt,t){this.t+=dt;const h=this.house;
    if(this.phase==='fly'){this.x+=this.dir*260*dt;if(reached(this,this.tx)){this.phase='jump';this.t=0;this.man={x:this.x-this.dir*30,y:this.y-50,k:1};}}
    else if(this.phase==='jump'){const k=Math.min(1,this.t/.6);this.man.x=this.x-this.dir*30+(h.cx-(this.x-this.dir*30))*k;this.man.y=this.y-50+(h.ctop-20-(this.y-50))*k-Math.sin(k*Math.PI)*60;if(k>=1){this.phase='in';this.t=0;}}
    else if(this.phase==='in'){this.man.k=Math.max(0,1-this.t/.5);this.man.y=h.ctop-20+this.t*60;if(this.t>.5&&!this.flashed){this.flashed=true;flashHouse(h);puff(h.cx,h.ctop,10);}if(this.t>1.4){this.phase='smoke';this.t=0;this.cy=h.ctop;this.target=rnd(260,430);}}
    else if(this.phase==='smoke'){this.cy=Math.max(this.target,this.cy-140*dt);if(SRND()<.6)puff(h.cx+Math.sin(t*2)*12,this.cy+10,2);if(this.cy<=this.target&&!this.placed){this.placed=true;placeCard(w,h.cx,this.cy,'below');burst(h.cx,this.cy,'#fff',20,20);this.bags=0;}if(this.placed&&this.t>2.2){this.phase='out';this.t=0;}}
    else if(this.phase==='out'){const k=Math.min(1,this.t/.6);this.man.k=Math.min(1,this.t*3);this.man.x=h.cx+(this.x-this.dir*30-h.cx)*k;this.man.y=h.ctop-20+(this.y-50-(h.ctop-20))*k-Math.sin(k*Math.PI)*90;if(k>=1){this.phase='leave';}}
    else{this.x+=this.dir*300*dt;}
    if(this.phase==='smoke'&&!this.placed){ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#fff';for(let yy=h.ctop;yy>this.cy;yy-=22){const k=(h.ctop-yy)/(h.ctop-this.cy+1);ctx.beginPath();ctx.arc(h.cx+Math.sin(yy*.05+t*2)*12*k,yy,8+14*k,0,TAU);ctx.fill();}ctx.restore();}
    const inSleigh=this.phase==='fly'||this.phase==='leave';if(inSleigh)trail(this);
    drawSleigh(this,t,{still:!inSleigh,santa:inSleigh?'ride':'none'});
    if(!inSleigh&&this.man.k>0){const pose=this.phase==='in'?'dive':this.phase==='jump'?'cheer':'stand';drawSantaMan(this.man.x,this.man.y,this.dir,pose,t,this.man.k);}
    return this.phase==='leave'&&outOfScreen(this);};return s;}};

/* 7. 굴뚝에 끼임 → 루돌프가 당겨 뺌 */
ACTORS.stuck={w:2,take:1,make([w]){const h=pickOne(houses);const dir=SRND()<.5?1:-1;const s=sleighBase(dir,h.ctop-150,h.cx);s.kind='stuck';s.bags=1;s.house=h;s.tx=h.cx+dir*90;s.phase='fly';s.man={x:h.cx,y:h.ctop-150,k:1};
  s.update=function(dt,t){this.t+=dt;const h=this.house;
    if(this.phase==='fly'){this.x+=this.dir*260*dt;if(reached(this,this.tx)){this.phase='jump';this.t=0;}}
    else if(this.phase==='jump'){const k=Math.min(1,this.t/.6);this.man.x=this.x-this.dir*30+(h.cx-(this.x-this.dir*30))*k;this.man.y=this.y-50+(h.ctop-20-(this.y-50))*k-Math.sin(k*Math.PI)*60;if(k>=1){this.phase='stuck';this.t=0;puff(h.cx,h.ctop,10);}}
    else if(this.phase==='stuck'){if(this.t>1.2&&!this.dropped){this.dropped=true;this.bags=0;const bx=clamp(h.cx+this.dir*80,400,W-400);spawnBox(w,'drop',bx,rnd(LAND[0],LAND[1]),h.ctop-40,{});burst(h.cx,h.ctop-20,'#f5c86a',20,160);}if(this.t>2.4){this.phase='pull';this.t=0;}}
    else if(this.phase==='pull'){this.x-=this.dir*20*Math.sin(this.t*12)*dt*8;if(this.t>1.2){this.phase='pop';this.t=0;burst(h.cx,h.ctop,'#fff',30,200);}}
    else if(this.phase==='pop'){const k=Math.min(1,this.t/.6);this.man.x=h.cx+(this.x-this.dir*30-h.cx)*k;this.man.y=h.ctop-20+(this.y-50-(h.ctop-20))*k-Math.sin(k*Math.PI)*110;if(k>=1){this.phase='leave';}}
    else{this.x+=this.dir*300*dt;}
    const inSleigh=this.phase==='fly'||this.phase==='leave';if(inSleigh)trail(this);
    // 밧줄
    if(this.phase==='pull'){ctx.strokeStyle='#d9b382';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(this.x+this.dir*100,this.y);ctx.lineTo(h.cx,h.ctop-30);ctx.stroke();}
    drawSleigh(this,t,{still:!inSleigh,santa:inSleigh?'ride':'none',lookBack:this.phase==='stuck'||this.phase==='pull',kick:this.phase==='pull'});
    if(this.phase==='jump')drawSantaMan(this.man.x,this.man.y,this.dir,'cheer',t);
    if(this.phase==='stuck'||this.phase==='pull'){drawSantaMan(h.cx,h.ctop-6,this.dir,'stuck',t);if(this.t<.8&&this.phase==='stuck'){ctx.fillStyle='#fff8e8';ctx.font='bold 36px serif';ctx.textAlign='center';ctx.fillText('!?',h.cx,h.ctop-90);}}
    if(this.phase==='pop')drawSantaMan(this.man.x,this.man.y,this.dir,'cheer',t);
    return this.phase==='leave'&&outOfScreen(this);};return s;}};

/* 8. 걸어서 배달 (미끄러짐) */
ACTORS.walk={w:2,take:1,make([w]){const p=spot(LAND);const dir=SRND()<.5?1:-1;
  return {kind:'walk',w,x:p.x-dir*ENTER*.7,ax:p.x,y:p.y,tx:p.x,dir,phase:'walk',t:0,slipX:p.x-dir*rnd(260,420),slipped:false,
    update(dt,t){this.t+=dt;
      if(this.phase==='walk'){this.x+=this.dir*150*dt;if(SRND()<.3)puff(this.x-this.dir*16,this.y+8,1);if(!this.slipped&&reached(this,this.slipX)){this.slipped=true;this.phase='slip';this.t=0;}else if(reached(this,this.tx-this.dir*40)){this.phase='put';this.t=0;}}
      else if(this.phase==='slip'){if(this.t<.25)this.x+=this.dir*300*dt;if(this.t>.25&&!this.thud){this.thud=true;burst(this.x+this.dir*30,this.y,'#fff',30,120);}if(this.t>1.6){this.phase='walk';this.t=0;}}
      else if(this.phase==='put'){if(this.t>.6&&!this.placedBox){this.placedBox=true;spawnBox(this.w,'drop',this.tx,this.y,this.y-40,{});}if(this.t>1.8){this.phase='stretch';this.t=0;}}
      else if(this.phase==='stretch'){if(this.t>1.2){this.phase='leave';this.dir*=-1;this.t=0;}}
      else if(this.phase==='leave'){this.x+=this.dir*170*dt;if(Math.abs(this.x-this.ax)>ENTER*.7+FADE)return true;}
      const bob=(this.phase==='walk'||this.phase==='leave')?Math.abs(Math.sin(t*12))*5:0;
      const pose=this.phase==='slip'?(this.t<.25?'cheer':'fall'):this.phase==='walk'?'carry':this.phase==='leave'?'walk':this.phase==='put'?'back':'stretch';
      ctx.save();if(pose==='stretch'){ctx.translate(this.x,this.y);ctx.rotate(-this.dir*.25*Math.sin(this.t*4)*Math.max(0,1-this.t/1.2));ctx.translate(-this.x,-this.y);}
      drawSantaMan(this.x,this.y-bob,this.dir,pose==='stretch'?'stand':pose,t);ctx.restore();
      if(this.phase==='slip'&&this.t>.25&&this.t<1.2){ctx.fillStyle='#f5c86a';ctx.font='26px serif';ctx.textAlign='center';for(let i=0;i<3;i++)ctx.fillText('★',this.x+Math.cos(t*4+i*2.1)*40,this.y-90+Math.sin(t*4+i*2.1)*14);}
      if(this.phase==='stretch'&&this.t<.8){ctx.fillStyle='#fff8e8';ctx.font="26px 'Nanum Pen Script',cursive";ctx.textAlign='center';ctx.fillText('아이고',this.x,this.y-150);}
      return false;}};}};

/* 9. 드론 배달 — 쇼의 선물 드론. 날아와 호버링 → 줄로 선물 내림 → 줄이 흔들려 한 번 헛딛고 → 놓고 퇴장 */
ACTORS.drone={w:2,take:1,make([w]){const p=spot(LAND);const dir=SRND()<.5?1:-1;const hy=rnd(240,360);
  return {kind:'drone',w,x:p.x-dir*ENTER,ax:p.x,y:hy,tx:p.x,ty:p.y,dir,phase:'fly',t:0,cable:0,sway:0,
    update(dt,t){this.t+=dt;
      if(this.phase==='fly'){this.x+=this.dir*300*dt;if(reached(this,this.tx)){this.x=this.tx;this.phase='hover';this.t=0;}}
      else if(this.phase==='hover'){if(this.t>.6){this.phase='lower';this.t=0;}}
      else if(this.phase==='lower'){const L=this.ty-this.y-40;this.cable=Math.min(L,this.cable+260*dt);this.sway=Math.sin(t*5)*.18*Math.min(1,this.cable/120);
        if(this.cable>=L){if(!this.miss&&SRND()<.5){this.miss=true;this.phase='miss';this.t=0;}else{this.phase='release';this.t=0;}}}
      else if(this.phase==='miss'){ // 줄이 너무 흔들려 선물이 눈에 닿았다 튕김 → 드론이 살짝 내려와 다시
        this.sway=Math.sin(t*9)*.32;this.y+=Math.sin(this.t*6)*1.5;if(this.t>1.1){this.phase='release';this.t=0;this.sway=0;}}

    ctx.save();ctx.translate(sx*58,-24);ctx.scale(1,.25);ctx.rotate(t*40);ctx.fillStyle='rgba(220,230,255,.75)';ctx.beginPath();ctx.ellipse(0,0,30,6,0,0,TAU);ctx.fill();ctx.restore();}
  ctx.fillStyle='#d8343f';ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(12,-10);ctx.lineTo(-6,-32);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';roundRect(ctx,-14,-14,28,6,3);ctx.fill();ctx.beginPath();ctx.arc(-6,-32,4,0,TAU);ctx.fill();
  // 매달린 작은 랜턴
  ctx.strokeStyle='#d9b382';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,16);ctx.lineTo(0,34);ctx.stroke();
  ctx.fillStyle='#f5c86a';ctx.shadowBlur=16;ctx.shadowColor='#ffd98a';ctx.beginPath();ctx.arc(0,40,6+Math.sin(t*6)*1,0,TAU);ctx.fill();ctx.shadowBlur=0;
  ctx.restore();}

/* ================= 분할 동기화 드라이버 (락스텝) ================= */
const NET=MadNet.makeNet(IS_HOST?'host':'viewer',SCREEN);
const MYID=Math.random().toString(36).slice(2,10);
const clk=()=>performance.timeOrigin+performance.now();
const D_STEPS=30;                       // 입력 지연: 호스트가 받은 입력을 30스텝(0.5초) 뒤에 모든 화면에서 동시에 적용 (네트워크·부하 여유)
const STOPAT=+(SQ.get('stopat')||Infinity); // 디버그: 이 스텝에서 멈춤 (화면 이음새 비교용)                       // 입력 지연: 호스트가 받은 입력을 12스텝(0.2초) 뒤에 모든 화면에서 동시에 적용
let OFFS=0,bestRtt=1e9,pongs=0;         // 호스트 시계와의 차이 (뷰어만)
let SESS=null,evN=0,lastN=0,ready=false,started=false,fontsOk=false;
function updReady(){ready=fontsOk&&(IS_HOST||(!!SESS&&pongs>=3));if(ready)overlay('');}
const EVQ=new Map(),EVLOG=[],RS=new Map(),CHK=new Map();
const realCtx=ctx,realBg=bg;
const hostNow=()=>clk()+OFFS;
const targetCount=()=>SESS?Math.floor((hostNow()-SESS.t0)/STEP_MS)+1:0;

/* 그림 없이 상태만 진행할 때 쓰는 빈 캔버스 (따라잡기용). 글자 폭 계산은 진짜 캔버스로 */
const MCTX=document.createElement('canvas').getContext('2d');
const GSTUB={addColorStop(){}};const NOOPF=()=>{};
const NOOP={};(()=>{const P=CanvasRenderingContext2D.prototype;for(const k of Object.getOwnPropertyNames(P)){if(k==='constructor')continue;const d=Object.getOwnPropertyDescriptor(P,k);
    if(typeof d.value==='function')NOOP[k]=k.startsWith('create')?()=>GSTUB:NOOPF;else NOOP[k]=realCtx[k];}
  NOOP.measureText=s=>MCTX.measureText(s);NOOP.canvas=MCTX.canvas;
  Object.defineProperty(NOOP,'font',{get(){return MCTX.font;},set(v){MCTX.font=v;}});})();

/* 그리기 생략 래퍼
   - 빈 캔버스(따라잡기) 중이면 그림만 그리는 함수는 통째로 건너뜀
   - 내 벽 밖이면(현재 변환으로 계산한 화면 위치가 구간 밖) 건너뜀 — 상태·난수를 안 건드리는 함수만 대상 */
function onScreen(x,y,r){const T=ctx.getTransform();const cx=T.a*x+T.c*y+T.e;const m=r*Math.max(Math.hypot(T.a,T.b),.05);return cx>-m&&cx<SW+m;}
const CULL_FN={drawElf:[0,1,260],drawDeer:[0,1,320],drawFig:[0,1,220],drawSantaMan:[0,1,360],drawBox:[1,2,200],drawBoxE:[0,1,200]};
for(const k of ['drawElf','stripes','starsDraw','auroraDraw','drawDeer','drawBox','treeLights','drawFig','drawSantaMan','drawBoxE']){const f=window[k];if(typeof f!=='function')continue;const cf=CULL_FN[k];
  window[k]=cf&&CULL?function(){if(ctx===NOOP)return;if(!onScreen(+arguments[cf[0]]||0,+arguments[cf[1]]||0,cf[2]))return;return f.apply(this,arguments);}
                     :function(){if(ctx===NOOP)return;return f.apply(this,arguments);};}
{const f=paperOn;window.paperOn=function(c){if(c===NOOP)return;return f.apply(this,arguments);};}

/* 상태 표시 (화면 구석 작은 배지 — ?hud=0 숨김) */
const HUD=document.createElement('div');HUD.style.cssText='position:fixed;left:10px;bottom:8px;z-index:30;font:12px ui-monospace,Menlo,monospace;color:#fff3d6;opacity:.55;pointer-events:none;white-space:pre';
if(SQ.get('hud')!=='0')document.body.appendChild(HUD);
const OVL=document.createElement('div');OVL.style.cssText='position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;font:600 28px "Gowun Batang",serif;color:#f5c86a;background:rgba(5,11,28,.55);pointer-events:none';document.body.appendChild(OVL);
const overlay=t=>{OVL.style.display=t?'flex':'none';if(t)OVL.textContent=t;};

function applyEv(e){
  if(e.k==='wish'){const n=queue.length;addWish(e.text,'',e.skin);if(queue.length>n)queue[n].lid=e.n;}
  else if(e.k==='force')forceKind=e.kind;
  else if(e.k==='map')nextMap(e.d);}
function queueEv(e){
  if(e.n<=lastN)return;                                   // 이미 받은 이벤트
  if(e.n!==lastN+1)return resync('이벤트 누락 #'+lastN+'→'+e.n);
  if(started&&e.s<simStep)return resync('늦게 도착한 이벤트');
  lastN=e.n;(EVQ.get(e.s)||EVQ.set(e.s,[]).get(e.s)).push(e);}
let resyncing=false;
function resync(why){if(resyncing)return;resyncing=true;console.warn('[santa] 재동기화:',why);overlay('화면 다시 맞추는 중… ('+why+')');
  try{sessionStorage.setItem('santa-resync',String((+sessionStorage.getItem('santa-resync')||0)+1));}catch(_){}
  setTimeout(()=>location.reload(),300);}

let FPS=0,DRAWMS=0,_fc=0,_ft=performance.now();
function stepOnce(draw){const _t0=draw?performance.now():0;
  if(simStep===0)SRESEED(SESS.seed);
  const evs=EVQ.get(simStep);if(evs){EVQ.delete(simStep);for(const e of evs)applyEv(e);}
  if(simStep%120===0){RS.set(simStep,RSTATE);if(RS.size>40)RS.delete(RS.keys().next().value);checkChk(simStep);}
  ctx=draw?realCtx:NOOP;bg=draw?realBg:NOOP;
  try{simFrame();}finally{ctx=realCtx;bg=realBg;}
  if(draw){DRAWMS=DRAWMS*.9+(performance.now()-_t0)*.1;_fc++;const n=performance.now();if(n-_ft>=1000){FPS=Math.round(_fc*1000/(n-_ft));_fc=0;_ft=n;}}
  simStep++;SIMNOW=simStep*STEP_MS;}

let lastDraw=0;
function pump(canDraw){
  if(!ready||!SESS||resyncing)return;
  const tgt=Math.min(targetCount(),STOPAT);if(tgt<=simStep){return;}
  started=true;
  const behind=tgt-simStep,until=performance.now()+(behind>4?28:1e6);
  while(simStep<tgt){const last=simStep===tgt-1;if(!last&&performance.now()>until)break;stepOnce(canDraw&&last);}
  if(simStep<tgt-30)overlay('따라잡는 중… '+Math.round((tgt-simStep)/60)+'초');else if(OVL.style.display!=='none'&&!resyncing)overlay('');
  if(canDraw)lastDraw=performance.now();}
function raf(){pump(true);requestAnimationFrame(raf);}
requestAnimationFrame(raf);
/* rAF 가 멈춰도(창 가려짐 등) 시뮬레이션은 계속 — 다시 보이면 그림 없이 빠르게 따라잡음 */
MadNet.steadyTimer(10,()=>{if(performance.now()-lastDraw>400)pump(false);});

/* ---- 호스트: 세션·입력·상태 ---- */
function newSession(delay){return{id:Math.random().toString(36).slice(2,9),seed:(Math.random()*2**31)|0,t0:clk()+delay};}
function hostInput(e){if(!IS_HOST||!SESS)return;
  e.s=Math.max(targetCount(),simStep)+D_STEPS;e.n=++evN;EVLOG.push(e);if(EVLOG.length>20000)EVLOG.splice(0,1);/* 아주 긴 세션 보호 */
  lastN=e.n-1;queueEv(e);NET.send({type:'ev',sid:SESS.id,ev:e});}
function hostReset(){const s=newSession(2500);try{sessionStorage.setItem('santa-next',JSON.stringify(s));}catch(_){}
  NET.send({type:'session',sess:s,evs:[]});setTimeout(()=>location.reload(),150);}
const SAMPLES=['내년엔 꼭 여행 가게 해주세요','가족 모두 건강하기','취업 성공!','우리 강아지 오래오래 살기','눈 오는 크리스마스','사랑하는 사람과 함께','매일 조금씩 더 행복하기','올해보다 나은 내년'];
const SKIN_KEYS={z:'glow',x:'candy',c:'ginger',v:'knit',b:'bulb',n:'gold'};
const KIND_KEYS={1:'santa',2:'back',3:'throw',4:'spill',5:'sleep',6:'dive',7:'stuck',8:'walk',9:'rudolph',0:'drone','-':'tree'};
let hostSkin='glow';
const sample=()=>SAMPLES[Math.floor(Math.random()*SAMPLES.length)];
function hostKey(k){
  if(k===']')hostInput({k:'map',d:1});else if(k==='[')hostInput({k:'map',d:-1});
  else if(k==='t'||k==='T')santaWish(sample(),hostSkin);
  else if(k==='y'||k==='Y'){for(let i=0;i<4;i++)santaWish(sample(),hostSkin);}
  else if(KIND_KEYS[k]){hostInput({k:'force',kind:KIND_KEYS[k]});santaWish(sample(),hostSkin);}
  else if(SKIN_KEYS[k]){hostSkin=SKIN_KEYS[k];santaWish(sample(),hostSkin);}}
addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M')return;if(IS_HOST)hostKey(e.key);else NET.send({type:'key',key:e.key});});
window.santaWish=(text,skin,src)=>{const e={k:'wish',text:String(text||'').slice(0,80),skin};hostInput(e);if(e.n)SLOG.send(e,src);};

/* ---- 체크섬: 120스텝마다 난수 상태 비교 → 어긋나면 그 화면만 다시 맞춤 ---- */
function checkChk(s){const h=CHK.get(s);if(h===undefined||!RS.has(s))return;CHK.delete(s);
  if(RS.get(s)!==h)resync('상태 불일치 @'+s);else{try{sessionStorage.removeItem('santa-resync');}catch(_){}}}
let lastChk=-1;

/* ---- 메시지 ---- */
NET.on(m=>{
  if(m.type==='_net'){if(m.up&&!IS_HOST)NET.send({type:'join',from:MYID,screen:SCREEN});return;}
  if(m.type==='cmd'){
    if(m.cmd==='reload'){if(IS_HOST)hostReset();else setTimeout(()=>location.reload(),400);return;}
    if(!IS_HOST)return;
    if(m.cmd==='reset'||m.cmd==='start')hostReset();
    else if(m.cmd==='demo')hostKey('Y');
    else if(m.cmd==='wish')santaWish(m.text||sample(),m.skin||'glow');
    else if(m.cmd==='map')hostKey(']');
    else if(m.cmd==='key')hostKey(m.key);
    return;}
  if(IS_HOST){
    if(m.type==='tping')NET.send({type:'tpong',to:m.from,a:m.a,h:clk()});
    else if(m.type==='join'&&SESS)NET.send({type:'session',to:m.from,sess:SESS,evs:EVLOG});
    else if(m.type==='key')hostKey(m.key);
    return;}
  /* 뷰어 */
  if(m.to&&m.to!==MYID)return;
  if(m.type==='tpong'){const now=clk(),rtt=now-m.a;pongs++;if(rtt<=bestRtt*1.5||pongs<3){if(rtt<bestRtt)bestRtt=rtt;OFFS=m.h+rtt/2-now;}
    updReady();}
  else if(m.type==='session'){
    if(SESS&&m.sess.id!==SESS.id){if(started)resync('새 세션');else{SESS=null;}}
    if(!SESS){SESS=m.sess;lastN=0;EVQ.clear();for(const e of m.evs||[])queueEv(e);updReady();}}
  else if(m.type==='ev'){if(SESS&&m.sid===SESS.id)queueEv(m.ev);}
  else if(m.type==='chk'){if(SESS&&m.sid===SESS.id){CHK.set(m.s,m.h);if(simStep>m.s)checkChk(m.s);}}
});

if(IS_HOST){
  let s=null;try{s=JSON.parse(sessionStorage.getItem('santa-next')||'null');sessionStorage.removeItem('santa-next');}catch(_){}
  SESS=(s&&s.t0>clk()-8000)?s:newSession(1500);
  NET.send({type:'session',sess:SESS,evs:[]});
  /* 상태 보고 (MadSync 마스터용): playing = 배달 진행 중 / idle = 대기 */
  let lastState='';
  MadNet.steadyTimer(2,()=>{if(!SESS)return;const state=(queue.length||actors.length)?'playing':'idle';
    NET.send({type:'status',state,count,step:simStep,sid:SESS.id,screen:SCREEN});
    if(state!==lastState){lastState=state;console.log('[santa] status',state);}
    /* 체크섬 방송 */
    const s=Math.floor((simStep-1)/120)*120;if(s>lastChk&&RS.has(s)){lastChk=s;NET.send({type:'chk',sid:SESS.id,s,h:RS.get(s)});}});
}else{
  const ping=()=>NET.send({type:'tping',from:MYID,a:clk()});
  let k=0;const pi=setInterval(()=>{ping();if(++k>=8){clearInterval(pi);setInterval(ping,3000);}},150);
  const ji=setInterval(()=>{if(SESS)return clearInterval(ji);NET.send({type:'join',from:MYID,screen:SCREEN});},1000);
  NET.send({type:'join',from:MYID,screen:SCREEN});
}

/* 글꼴이 다 들어온 뒤 시작 (글자 줄바꿈이 화면마다 같아야 함) */
const FONT_SPECS=[CARD_FONT,SKIN_FONT,"52px 'Nanum Pen Script'","16px 'Gowun Batang'","700 16px 'Gowun Batang'","400 16px 'Black Han Sans'"];
Promise.race([Promise.all(FONT_SPECS.map(f=>document.fonts.load(f,'가나다ABC'))).then(()=>document.fonts.ready),new Promise(r=>setTimeout(r,6000))])
  .then(()=>{fontsOk=true;updReady();if(!ready&&!IS_HOST)overlay('호스트 기다리는 중…');});

setInterval(()=>{HUD.textContent=`${FPS}fps draw ${DRAWMS.toFixed(1)}ms · screen ${SCREEN}${IS_HOST?' HOST':''} · ${NET.mode} · step ${simStep}${SESS?' · '+SESS.id:''}${IS_HOST?'':' · offs '+OFFS.toFixed(1)+'ms rtt '+bestRtt.toFixed(1)}`;},500);
window.__santa={get step(){return simStep;},get rng(){return RSTATE;},get sess(){return SESS;},get count(){return count;},get cards(){return cards.length;},get actors(){return actors.map(a=>a.kind);}};

/* ================= 구글 시트 로그 (호스트만) =================
   ?sheet=<Apps Script 웹 앱 URL>  (없으면 SHEET_URL 기본값, 둘 다 비면 기록 안 함) · 3초마다 묶어서 전송
   종류: boot 화면 시작 · connect 폰 접속 · close 폰 나감(체류) · send 문장 받음(대기) · show 화면 표시(표시까지) · reject 욕설 차단 · test 키/명령 테스트 */
const SHEET_DEFAULT='https://script.google.com/macros/s/AKfycbzBsj_hIpYQ_hEQMlGfLmm2yFmr9jq57h7jbUsQ0h1zI9BKmEpweX4VTKxM7YJC9yYoiQ/exec'; // 더아카이브 산타의 선물 집계
const SHEET_URL=SQ.get('sheet')==='0'?'':(SQ.get('sheet')||(SQ.get('room')?'':SHEET_DEFAULT)); // 테스트 방(room 지정)은 기록 안 함, ?sheet=0 끄기
const KIND_KO2={santa:'썰매 투하',back:'후진 배달',throw:'하늘 던지기',spill:'자루 쏟기',sleep:'졸다 깸',dive:'굴뚝 다이빙',stuck:'굴뚝 끼임',walk:'걸어서 배달',rudolph:'루돌프',drone:'드론 단독',tree:'트리'};
const BAN=['시발','씨발','씨빨','시빨','씨팔','시팔','ㅅㅂ','ㅆㅂ','ㅅ1ㅂ','병신','븅신','빙신','ㅂㅅ','좆','존나','졸라','ㅈㄴ','개새','개색','개세','개쉐','새꺄','지랄','ㅈㄹ','염병','미친놈','미친년','미친새','또라이','닥쳐','꺼져','느금','니애미','니미','애미','애비','엠창','창녀','걸레','보지','자지','섹스','fuck','shit','bitch','sex','ㅗ']
  .concat((SQ.get('ban')||'').split(',').filter(Boolean));
const SLOG={conns:0,sents:0,rejects:0,buf:[],meta:new Map(),cinfo:new Map(),
  id(c){return c&&c.peer?String(c.peer).slice(-6):'';},
  push(r){if(!IS_HOST||!SHEET_URL)return;r.t=Date.now();r.online=typeof conns!=='undefined'?conns.size:'';r.conns=this.conns;r.sents=this.sents;r.rejects=this.rejects;this.buf.push(r);},
  bad(t){const n=String(t||'').toLowerCase().replace(/[\s.,!?~\-_*·'"`^]/g,'');return BAN.find(b=>n.includes(b))||'';},
  connect(c){this.conns++;this.cinfo.set(c,Date.now());this.push({kind:'connect',id:this.id(c)});},
  close(c){const t0=this.cinfo.get(c);if(t0===undefined)return;this.cinfo.delete(c);this.push({kind:'close',id:this.id(c),stay:Math.round((Date.now()-t0)/1000)});},
  reject(c,text,word){this.rejects++;this.push({kind:'reject',id:this.id(c),text,note:'금칙어: '+word});},
  send(e,c){this.sents++;let pend=0;for(const l of EVQ.values())for(const x of l)if(x.k==='wish'&&x!==e)pend++;
    const id=c?this.id(c):'';this.meta.set(e.n,{t:Date.now(),id:c?id:'test',text:e.text,skin:e.skin});
    this.push({kind:c?'send':'test',id,text:e.text,skin:e.skin,wait:queue.length+pend});},
  show(w){const m=this.meta.get(w.lid);if(!m)return;this.meta.delete(w.lid);
    this.push({kind:'show',id:m.id==='test'?'':m.id,text:m.text,skin:m.skin,via:KIND_KO2[w.kind]||w.kind||'',show:+((Date.now()-m.t)/1000).toFixed(1),note:m.id==='test'?'테스트':''});},
  flush(){if(!this.buf.length||!SHEET_URL)return;const rows=this.buf.splice(0,200);
    try{fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rows}),keepalive:true}).catch(()=>{this.buf.unshift(...rows);});}catch(_){this.buf.unshift(...rows);}}};
if(IS_HOST){SLOG.push({kind:'boot',note:'화면 시작 · screen '+SCREEN+(SESS?' · 세션 '+SESS.id:'')});setInterval(()=>SLOG.flush(),3000);addEventListener('pagehide',()=>SLOG.flush());
  const _pc=placeCard;window.placeCard=function(w){const r=_pc.apply(this,arguments);if(w&&w.lid)SLOG.show(w);return r;};}
</script>

<div id="bgmHint" style="position:fixed;right:24px;bottom:24px;z-index:20;font:600 15px 'Gowun Batang',serif;color:#fff3d6;background:rgba(5,11,28,.7);border:1px solid rgba(245,200,106,.5);border-radius:999px;padding:8px 16px;cursor:pointer">♪ 클릭하면 음악이 시작돼요</div>
<script>
/* ===== BGM: 「고요한 밤」(Gruber, 1818, 퍼블릭 도메인) 오르골+패드 편곡 · WebAudio 합성 =====
   ?bgm=0 끄기 · M 키 음소거 토글 · ?vol=0.6 볼륨 */
(()=>{const QP=new URLSearchParams(location.search);if(QP.get('bgm')==='0'||(!IS_HOST&&QP.get('bgm')!=='1')){document.getElementById('bgmHint').remove();return;}
const VOL=parseFloat(QP.get('vol'))||.75;let ac=null,master=null,rev=null,muted=false,started=false;
const hint=document.getElementById('bgmHint');
const N=n=>{const m={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n[0]];const acc=n[1]==='#'?1:n[1]==='b'?-1:0;const o=+n[n.length-1];return 440*Math.pow(2,(m+acc+(o-4)*12-9)/12);};
// 멜로디 [음, 박] — 3/4박
const MEL=[['G4',1.5],['A4',.5],['G4',1],['E4',3],['G4',1.5],['A4',.5],['G4',1],['E4',3],['D5',2],['D5',1],['B4',3],['C5',2],['C5',1],['G4',3],
 ['A4',2],['A4',1],['C5',1.5],['B4',.5],['A4',1],['G4',1.5],['A4',.5],['G4',1],['E4',3],['A4',2],['A4',1],['C5',1.5],['B4',.5],['A4',1],['G4',1.5],['A4',.5],['G4',1],['E4',3],
 ['D5',2],['D5',1],['F5',1.5],['D5',.5],['B4',1],['C5',3],['E5',3],['C5',1.5],['G4',.5],['E4',1],['G4',1.5],['F4',.5],['D4',1],['C4',3],[null,3]];
const CH={C:['C3','E3','G3','C4'],G7:['G2','F3','B3','D4'],F:['F2','A3','C4','F4'],Am:['A2','E3','A3','C4']};
const BARS=['C','C','C','C','G7','G7','C','C','F','F','C','C','F','F','C','C','G7','G7','C','Am','C','G7','C','C'];
const BEAT=.92,BAR=BEAT*3,SONG=BARS.length*BAR;
function init(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=VOL;master.connect(ac.destination);
  // 리버브(합성 임펄스)
  const len=ac.sampleRate*3.2,ir=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
  rev=ac.createConvolver();rev.buffer=ir;const rg=ac.createGain();rg.gain.value=.55;rev.connect(rg);rg.connect(master);window.__bgmAC=ac;window.__bgmOut=master;window.__bgmRev=rev;}
function box(f,t,v,d=2.4){ // 오르골: 기음+배음, 짧은 어택·긴 감쇠
  [[1,1],[2,.32],[3.01,.12],[4.2,.05]].forEach(([r,a])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*r;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*a,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d/r**.5);
    o.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+d+.1);});}
function pad(fs,t,dur,v){const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.9);g.gain.setValueAtTime(v,t+dur-.6);g.gain.linearRampToValueAtTime(0,t+dur+.4);
  lp.connect(g);g.connect(master);g.connect(rev);fs.forEach(f=>{[-4,4].forEach(dt=>{const o=ac.createOscillator();o.type='triangle';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+.5);});});}
function sparkle(t){box(N(['C6','E6','G6','C7','E7'][Math.random()*5|0]),t,.05,1.6);}
function song(t0){let t=t0;for(const [n,b] of MEL){if(n)box(N(n),t,.16);t+=b*BEAT;}
  BARS.forEach((c,i)=>{const tb=t0+i*BAR;pad(CH[c].map(N),tb,BAR,.035);box(N(CH[c][0])/2*2,tb,.07,3);box(N(CH[c][2]),tb+BEAT,.045,1.8);box(N(CH[c][1]),tb+BEAT*2,.045,1.8);if(Math.random()<.35)sparkle(tb+BEAT*(1+Math.random()*2));});
  setTimeout(()=>song(t0+SONG+BAR),(t0+SONG-ac.currentTime-1.5)*1000);}
function start(){if(started){if(ac.state==='suspended')ac.resume();return;}started=true;init();song(ac.currentTime+.4);hint.remove();}
addEventListener('pointerdown',start);addEventListener('keydown',e=>{if(e.key==='m'||e.key==='M'){if(!started)return start();muted=!muted;master.gain.setTargetAtTime(muted?0:VOL,ac.currentTime,.2);}else start();});
// 크롬을 --autoplay-policy=no-user-gesture-required 로 띄우면 클릭 없이 자동 시작
try{const t=new (window.AudioContext||window.webkitAudioContext)();if(t.state==='running'){t.close();start();}else t.close();}catch(e){}
// 소원 공개 순간: 작은 반짝 종소리 (BGM에 섞임)
window.bgmChime=()=>{if(!started||muted)return;const t=ac.currentTime+.02;['G5','C6','E6'].forEach((n,i)=>box(N(n),t+i*.09,.09,1.8));};
})();
</script>
